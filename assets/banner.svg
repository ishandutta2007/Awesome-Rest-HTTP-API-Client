<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c471ed" />
      <stop offset="100%" stop-color="#f64f59" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.5" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-18px) translateX(12px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes floatReverse {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(16px) translateX(-14px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }
    @keyframes pillPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6)); }
    }

    .bg-shape-1 {
      animation: pulseGlow 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .bg-shape-2 {
      animation: pulseGlow 10s ease-in-out 2s infinite alternate;
      transform-origin: 1000px 260px;
    }
    .data-wire {
      stroke-dasharray: 8, 8;
      animation: dashCycle 2.5s linear infinite;
    }
    .p1 { animation: floatParticle 6s ease-in-out infinite; }
    .p2 { animation: floatReverse 7s ease-in-out infinite 1s; }
    .p3 { animation: floatParticle 8s ease-in-out infinite 2s; }
    .p4 { animation: floatReverse 5s ease-in-out infinite 1.5s; }
    .method-pill { animation: pillPulse 4s ease-in-out infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs (Background layer) -->
  <circle class="bg-shape-1" cx="200" cy="90" r="140" fill="#0284c7" filter="url(#softGlow)" />
  <circle class="bg-shape-2" cx="1020" cy="270" r="160" fill="#7c3aed" filter="url(#softGlow)" />
  <circle cx="600" cy="180" r="180" fill="#0f172a" opacity="0.6" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Circuit / Pipeline Network (Background) -->
  <g opacity="0.4">
    <path class="data-wire" d="M 50 180 L 320 180 L 380 90 L 820 90 L 880 180 L 1150 180" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="data-wire" d="M 120 280 L 400 280 L 460 210 L 740 210 L 800 280 L 1080 280" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="380" cy="90" r="4" fill="#38bdf8" />
    <circle cx="820" cy="90" r="4" fill="#38bdf8" />
    <circle cx="460" cy="210" r="3.5" fill="#a855f7" />
    <circle cx="740" cy="210" r="3.5" fill="#a855f7" />
  </g>

  <!-- Animated Floating Data Particles -->
  <circle class="p1" cx="150" cy="80" r="3" fill="#38bdf8" />
  <circle class="p2" cx="1060" cy="90" r="3.5" fill="#c084fc" />
  <circle class="p3" cx="240" cy="300" r="2.5" fill="#38bdf8" />
  <circle class="p4" cx="950" cy="300" r="3" fill="#ec4899" />
  <circle class="p1" cx="600" cy="40" r="2" fill="#34d399" />

  <!-- Top Badges / HTTP Protocol Status Indicators (Dynamic Decor) -->
  <g class="method-pill" transform="translate(365, 45)">
    <rect x="0" y="0" width="70" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
    <text x="35" y="16" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">GET</text>
  </g>

  <g class="method-pill" transform="translate(450, 45)">
    <rect x="0" y="0" width="76" height="24" rx="12" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
    <text x="38" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">POST</text>
  </g>

  <g class="method-pill" transform="translate(540, 45)">
    <rect x="0" y="0" width="68" height="24" rx="12" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1" />
    <text x="34" y="16" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">PUT</text>
  </g>

  <g class="method-pill" transform="translate(622, 45)">
    <rect x="0" y="0" width="86" height="24" rx="12" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1" />
    <text x="43" y="16" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">DELETE</text>
  </g>

  <g class="method-pill" transform="translate(722, 45)">
    <rect x="0" y="0" width="94" height="24" rx="12" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1" />
    <text x="47" y="16" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">GRAPHQL</text>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Always in front and unclipped) -->
  <g id="foreground-content">
    <!-- Main Header -->
    <text x="600" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Ubuntu, sans-serif" font-size="46" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5" filter="url(#glow)">
      Awesome REST &amp; HTTP API Clients
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif" font-size="17" font-weight="400" fill="#e2e8f0" letter-spacing="0.2">
      Curated Catalog of Modern API Development, Debugging, Testing &amp; Automation Tools
    </text>

    <!-- Subtitle Line 2 / Feature highlights -->
    <text x="600" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      🚀 SaaS Platforms &amp; Enterprise Suites • ⚡ Git-Native &amp; Offline-First Open-Source • 🛠️ Multi-Protocol Workbenches
    </text>
  </g>

  <!-- Bottom Accent Card / Stats Bar -->
  <g transform="translate(300, 275)">
    <rect x="0" y="0" width="600" height="46" rx="23" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" />
    
    <text x="100" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🌐 REST • GRAPHQL • gRPC</text>
    <circle cx="205" cy="23" r="2.5" fill="rgba(255, 255, 255, 0.3)" />
    
    <text x="300" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a855f7">📁 100% GIT-FRIENDLY &amp; OFFLINE</text>
    <circle cx="395" cy="23" r="2.5" fill="rgba(255, 255, 255, 0.3)" />
    
    <text x="500" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">⭐ STAR-SORTED COMMUNITY</text>
  </g>

  <!-- Subtle Border Stroke for the entire banner -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
</svg>
